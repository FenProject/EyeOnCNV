[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eyeoncnv"
dynamic = ["version"]
description = "Detects the small copy-number events that bin-based CNV callers miss (roughly 30-100 bp), by following read depth base by base."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lotfi Otmane" }]
requires-python = ">=3.10"
keywords = ["CNV", "copy number", "targeted sequencing", "samtools", "HGVS"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=2.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
hgvs = ["hgvs>=1.5"]
xls = ["xlrd>=2.0"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
eyeoncnv = "eyeoncnv.cli:main"

[tool.setuptools.dynamic]
version = { attr = "eyeoncnv.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["eyeoncnv", "conftest"]
